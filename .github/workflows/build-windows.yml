name: Build Windows installer

# Branch builds produce test artifacts without requiring a draft release or signing credentials.
on:
  push:
    branches: [work]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check product contracts and portable policies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test product inputs and check component boundaries
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/check-dictionary-contract.py
          python3 scripts/check-product-lock-contract.py
          python3 ui-html/scripts/sync-contracts.py --check
          python3 ui/scripts/check-boundary.py
          bash scripts/ci/check-developer-paths.sh
          bash scripts/format.sh --check
      - name: Build and test portable policies with sanitizers
        run: |
          cmake -S server/tests/portable -B server/tests/portable/build -DCMAKE_BUILD_TYPE=Debug -DMSIME_PORTABLE_TESTS_SANITIZE=ON
          cmake --build server/tests/portable/build --parallel 4
          ctest --test-dir server/tests/portable/build --no-tests=error --output-on-failure

  tsf:
    name: Build TSF ${{ matrix.name }}
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            architecture: x64
            triplet: x64-windows-static
            build_dir: windows/build64-release
          - name: Win32
            architecture: Win32
            triplet: x86-windows-static
            build_dir: windows/build32-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/vcpkg-cache
        id: vcpkg-cache
        with:
          scope: tip-${{ matrix.triplet }}
      - name: Stamp the binary version
        shell: pwsh
        run: python scripts/apply_version.py
      - name: Configure
        shell: pwsh
        run: >
          cmake -S windows -B ${{ matrix.build_dir }} -A ${{ matrix.architecture }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
      - name: Save dependency binaries
        if: steps.vcpkg-cache.outputs.matched-key != format('{0}-complete', steps.vcpkg-cache.outputs.key)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vcpkg-cache.outputs.path }}
          key: ${{ steps.vcpkg-cache.outputs.key }}-complete
      - name: Build
        run: cmake --build ${{ matrix.build_dir }} --config Release --parallel 4
      - name: Check binaries and test the wire contract
        shell: pwsh
        run: |
          ./scripts/ci/check-tsf-dll.ps1 -BuildDir '${{ matrix.build_dir }}'
          ctest --test-dir ${{ matrix.build_dir }} -C Release --no-tests=error --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'TSF contract tests failed' }
      - name: Upload TSF binaries and symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-tsf-${{ matrix.name }}
          path: ${{ matrix.build_dir }}/Release
          if-no-files-found: error
          retention-days: 14

  server:
    name: Build and test Server
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/vcpkg-cache
        id: vcpkg-cache
        with:
          scope: server-x64-windows-and-static-md
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install Boost
        shell: pwsh
        run: ./scripts/ci/install-boost.ps1
      - name: Configure
        shell: pwsh
        run: >
          cmake -S server -B server/build-release -G "Ninja Multi-Config"
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Save dependency binaries
        if: steps.vcpkg-cache.outputs.matched-key != format('{0}-complete', steps.vcpkg-cache.outputs.key)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vcpkg-cache.outputs.path }}
          key: ${{ steps.vcpkg-cache.outputs.key }}-complete
      - name: Build
        run: cmake --build server/build-release --config Release --parallel 4
      - name: Check required binaries
        shell: pwsh
        run: ./scripts/ci/check-server-binaries.ps1 -BuildDir server/build-release/bin/Release
      - name: Test Server with locked dictionaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci/test-server.ps1 -ServerRoot server -StagingRoot "$env:RUNNER_TEMP/product-data" -BuildDir build-release
      # Keep the normal, non-uiAccess manifest: these test binaries are unsigned.
      - name: Upload Server binaries and symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-server
          path: server/build-release/bin/Release
          if-no-files-found: error
          retention-days: 14

  pages:
    name: Build and test settings page
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui-html/webview2/settings/ime-settings/pnpm-lock.yaml
      - name: Install, test and build
        working-directory: ui-html/webview2/settings/ime-settings
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          test -s dist/index.html
      - name: Upload web assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-webview2
          path: |
            ui-html/webview2/candwnd
            ui-html/webview2/ftb
            ui-html/webview2/menu
            ui-html/webview2/shared
            ui-html/webview2/settings/ime-settings/dist
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package unsigned test installer
    needs: [tsf, server, pages]
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-tsf-Win32
          path: windows/build32-release/Release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-tsf-x64
          path: windows/build64-release/Release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-server
          path: server/build-release/bin/Release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-webview2
          path: ui-html/webview2
      - name: Prepare verified dictionaries and sentence models
        shell: pwsh
        run: ./scripts/prepare-package-inputs.ps1
      - name: Install the Inno Setup Chinese language file
        shell: pwsh
        run: ./scripts/ci/install-inno-language.ps1
      - name: Collect payload and compile installer
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          ./installer/Prepare-PackageFiles.ps1 -TargetVersion $version -RepoRoot $PWD.Path
          python scripts/product_lock.py manifest --windows-commit "$env:GITHUB_SHA" --output installer/app_data/product-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Product manifest generation failed' }
          ./installer/Compile-Installer.ps1
          $name = "MetasequoiaIME_Setup_v$version-unsigned.exe"
          $output = Join-Path $PWD 'installer/Output'
          Rename-Item -LiteralPath (Join-Path $output "MetasequoiaIME_Setup_v$version.exe") -NewName $name
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $output $name)).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath (Join-Path $output 'SHA256SUMS.txt') -Encoding utf8
          @(
            "Commit: $env:GITHUB_SHA"
            "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            'Unsigned test build; no uiAccess support for elevated applications.'
          ) | Set-Content -LiteralPath (Join-Path $output 'BUILD.txt') -Encoding utf8
          "Installer: $name (unsigned test build). Download from this run's Artifacts." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload installer and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-unsigned-${{ github.run_number }}
          path: |
            installer/Output/*-unsigned.exe
            installer/Output/SHA256SUMS.txt
            installer/Output/BUILD.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
